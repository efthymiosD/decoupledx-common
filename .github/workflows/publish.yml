name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Deploys the checked-out version (the tag name must match the pom version).
# Releases are immutable on GitHub Packages: re-deploying the same version
# fails with HTTP 409 — this is the guard, not an error. Flow:
#   bump version -> commit -> tag vX.Y.Z -> git push origin main vX.Y.Z
# Main-branch pushes only ever verify (ci.yml); docs-only pushes never
# re-deploy an already-released version.
jobs:
  publish:
    name: verify + deploy to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Configure distribution credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Deploy
        run: ./mvnw -B -ntp deploy -DskipTests
